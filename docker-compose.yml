name: peileme

services:
  db:
    image: postgres:16-alpine
    container_name: peileme-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - peileme_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: peileme-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/data/uploads
      LLM_PRIMARY: ${LLM_PRIMARY:-tuzi}
      LLM_TUZI_BASE_URL: ${LLM_TUZI_BASE_URL:-https://api.tu-zi.com}
      LLM_TUZI_API_KEY: ${LLM_TUZI_API_KEY:-}
      LLM_TUZI_MODEL: ${LLM_TUZI_MODEL:-gpt-5.4}
      LLM_DATAEYES_BASE_URL: ${LLM_DATAEYES_BASE_URL:-https://cloud.dataeyes.ai}
      LLM_DATAEYES_API_KEY: ${LLM_DATAEYES_API_KEY:-}
      LLM_DATAEYES_MODEL: ${LLM_DATAEYES_MODEL:-gemini-2.5-pro}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BACKOFF_MS: ${LLM_RETRY_BACKOFF_MS:-800}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-90000}
    volumes:
      - peileme_uploads:/app/data/uploads
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    networks:
      - internal

  web-main:
    build:
      context: .
      dockerfile: Dockerfile.web-main
      args:
        VITE_SHARE_URL: ${VITE_MAIN_URL:-https://peileme.art/}
    container_name: peileme-web-main
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_MAIN_PORT:-18083}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    networks:
      - internal

  web-ai:
    build:
      context: .
      dockerfile: Dockerfile.web-ai
      args:
        VITE_SHARE_URL: ${VITE_AI_URL:-https://ai.peileme.art/}
    container_name: peileme-web-ai
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_AI_PORT:-18084}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  peileme_postgres:
  peileme_uploads:
